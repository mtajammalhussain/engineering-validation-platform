[flake8]
max-line-length = 100
exclude = .venv,__pycache__
# Autogenerated Alembic migrations stay unchanged: ignore only their layout/whitespace
# style codes. All other checks (e.g. F-codes such as unused imports) still apply.
per-file-ignores =
    migrations/versions/*.py: E122,E128,E501,W291

[tool:pytest]
testpaths = tests
markers =
    integration: needs a real PostgreSQL database (TEST_DB_* env vars)
