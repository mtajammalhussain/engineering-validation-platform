# Alembic configuration for results-api (docs/APP_SPEC.md §2.7).
#
# Deliberately contains NO database URL and NO password: migrations/env.py builds the
# connection from the DB_* environment variables via app.config and app.db.
# Logging is configured in env.py with app.logging_config (stdout, LOG_FORMAT text/json).
#
# Run from services/results-api:  alembic upgrade head

[alembic]
# Folder with env.py and the migration scripts (versions/)
script_location = %(here)s/migrations

# Make the "app" package importable from env.py
prepend_sys_path = .
path_separator = os
