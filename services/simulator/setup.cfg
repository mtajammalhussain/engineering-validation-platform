[flake8]
max-line-length = 100
exclude = .venv,__pycache__

[tool:pytest]
testpaths = tests
# Same command in every service. The simulator has no integration tests (no database), so
# "-m not integration" simply runs all tests.
addopts = -m "not integration"
markers =
    integration: needs a real PostgreSQL database (TEST_DB_* env vars)
