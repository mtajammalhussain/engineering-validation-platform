[flake8]
max-line-length = 100
exclude = .venv,__pycache__

[tool:pytest]
testpaths = tests
# Plain "pytest" runs only tests that need no database. An explicit "-m integration" on the
# command line replaces this default (the last -m wins).
addopts = -m "not integration"
markers =
    integration: needs a real PostgreSQL database (TEST_DB_* env vars)
